<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>单摆模拟器 · Pendulum Simulator</title>
<style>
  :root {
    --bg: #1a1a24;
    --panel: rgba(30, 32, 48, 0.82);
    --border: rgba(255, 255, 255, 0.08);
    --text: #e6e9f0;
    --muted: #8b90a0;
    --accent: #5ad7ff;
    --glow: #7ae3ff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    overflow: hidden;
  }
  #stage {
    position: fixed;
    inset: 0;
    display: block;
    cursor: crosshair;
  }
  .hud {
    position: fixed;
    top: 18px;
    left: 18px;
    padding: 14px 18px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    backdrop-filter: blur(8px);
    font-size: 13px;
    line-height: 1.9;
    min-width: 200px;
    pointer-events: none;
  }
  .hud h1 {
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 1px;
    margin-bottom: 6px;
    color: var(--accent);
  }
  .hud .val { color: var(--accent); font-family: "Consolas", monospace; }
  .hud .lbl { color: var(--muted); }
  .panel {
    position: fixed;
    right: 18px;
    top: 18px;
    width: 260px;
    padding: 16px 18px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    backdrop-filter: blur(8px);
    font-size: 13px;
  }
  .panel h2 {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 1px;
    color: var(--muted);
    margin-bottom: 14px;
  }
  .ctrl { margin-bottom: 14px; }
  .ctrl label {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--text);
    margin-bottom: 6px;
  }
  .ctrl label b { color: var(--accent); font-family: "Consolas", monospace; }
  input[type="range"] {
    width: 100%;
    -webkit-appearance: none;
    height: 4px;
    border-radius: 2px;
    background: rgba(255, 255, 255, 0.12);
    outline: none;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
    box-shadow: 0 0 8px rgba(90, 215, 255, 0.7);
  }
  .btn-row { display: flex; gap: 10px; margin-top: 6px; }
  button {
    flex: 1;
    padding: 9px 0;
    font-size: 13px;
    font-weight: 600;
    font-family: inherit;
    color: var(--text);
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid var(--border);
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  button:hover { background: rgba(90, 215, 255, 0.15); border-color: var(--accent); }
  button.primary { background: var(--accent); color: #10121c; border-color: var(--accent); }
  button.primary:hover { filter: brightness(1.1); }
  .hint {
    position: fixed;
    bottom: 14px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 1px;
    pointer-events: none;
  }
</style>
</head>
<body>
  <canvas id="stage"></canvas>

  <div class="hud">
    <h1>单摆模拟器</h1>
    <div><span class="lbl">摆角 </span><span class="val" id="hudTheta">45.0°</span></div>
    <div><span class="lbl">角速度 </span><span class="val" id="hudOmega">0.00 rad/s</span></div>
    <div><span class="lbl">周期(小角度) </span><span class="val" id="hudPeriod">— s</span></div>
    <div><span class="lbl">状态 </span><span class="val" id="hudState">运行中</span></div>
  </div>

  <div class="panel">
    <h2>参数控制</h2>
    <div class="ctrl">
      <label>摆长 L <b id="valL">200 px</b></label>
      <input type="range" id="sliderL" min="80" max="400" value="200" step="1">
    </div>
    <div class="ctrl">
      <label>重力 g <b id="valG">9.8</b></label>
      <input type="range" id="sliderG" min="1" max="25" value="9.8" step="0.1">
    </div>
    <div class="ctrl">
      <label>初始摆角 <b id="valA">45°</b></label>
      <input type="range" id="sliderA" min="5" max="85" value="45" step="1">
    </div>
    <div class="btn-row">
      <button id="btnPause" class="primary">暂停</button>
      <button id="btnReset">重置</button>
    </div>
  </div>

  <div class="hint">拖拽画布可推动摆球 · 双击复位</div>

<script>
(function () {
  const canvas = document.getElementById('stage');
  const ctx = canvas.getContext('2d');

  // —— 物理参数（初始值按实验要求）——
  let L = 200;        // 摆长 / px
  let g = 9.8;        // 重力加速度
  let angle0 = 45;    // 初始摆角 / 度
  let theta = angle0 * Math.PI / 180; // 当前摆角 / 弧度
  let omega = 0;      // 角速度 / rad/s
  let running = true;

  const TRAIL_MAX = 120;
  let trail = [];

  const elL = document.getElementById('sliderL');
  const elG = document.getElementById('sliderG');
  const elA = document.getElementById('sliderA');
  const valL = document.getElementById('valL');
  const valG = document.getElementById('valG');
  const valA = document.getElementById('valA');
  const btnPause = document.getElementById('btnPause');
  const btnReset = document.getElementById('btnReset');

  function resize() {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  function reset() {
    theta = angle0 * Math.PI / 180;
    omega = 0;
    trail = [];
    running = true;
    btnPause.textContent = '暂停';
  }

  function pivot() {
    return { x: window.innerWidth / 2, y: Math.min(120, window.innerHeight * 0.18) };
  }
  function bobPos() {
    const p = pivot();
    return { x: p.x + L * Math.sin(theta), y: p.y + L * Math.cos(theta) };
  }

  // —— 物理更新：θ'' = -(g/L)·sin θ，半隐式欧拉积分 ——
  function step(dt) {
    if (!running) return;
    const clamped = Math.min(dt, 0.05);
    const alpha = -(g / L) * Math.sin(theta);
    omega += alpha * clamped;
    theta += omega * clamped;
  }

  let last = performance.now();
  let lastTrail = 0;

  function frame(now) {
    const dt = (now - last) / 1000;
    last = now;
    step(dt);

    const p = pivot();
    const b = bobPos();

    if (now - lastTrail > 16) {
      trail.push({ x: b.x, y: b.y });
      if (trail.length > TRAIL_MAX) trail.shift();
      lastTrail = now;
    }

    draw(p, b);
    updateHud();
    requestAnimationFrame(frame);
  }

  function draw(p, b) {
    const w = window.innerWidth, h = window.innerHeight;
    // 深灰科技背景 + 微弱径向渐变
    ctx.clearRect(0, 0, w, h);
    const bg = ctx.createRadialGradient(p.x, p.y, 20, p.x, p.y, Math.max(w, h) * 0.7);
    bg.addColorStop(0, '#242431');
    bg.addColorStop(1, '#1a1a24');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, w, h);

    drawGrid(w, h);
    drawTrail();

    // 顶部支架
    ctx.fillStyle = '#3a3d4f';
    ctx.fillRect(p.x - 90, p.y - 14, 180, 8);
    ctx.fillStyle = '#2b2d3a';
    ctx.fillRect(p.x - 60, p.y - 8, 120, 5);

    // 摆杆
    ctx.strokeStyle = 'rgba(220, 226, 240, 0.85)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
    ctx.lineTo(b.x, b.y);
    ctx.stroke();

    // 角度弧
    drawAngleArc(p);

    // 支点
    ctx.beginPath();
    ctx.arc(p.x, p.y, 5, 0, Math.PI * 2);
    ctx.fillStyle = '#e6e9f0';
    ctx.fill();

    // 摆球（微弱发光）
    ctx.save();
    ctx.shadowColor = 'rgba(122, 227, 255, 0.9)';
    ctx.shadowBlur = 22;
    const ball = ctx.createRadialGradient(b.x - 4, b.y - 6, 2, b.x, b.y, 22);
    ball.addColorStop(0, '#c9f4ff');
    ball.addColorStop(0.5, '#5ad7ff');
    ball.addColorStop(1, '#1f7fb8');
    ctx.fillStyle = ball;
    ctx.beginPath();
    ctx.arc(b.x, b.y, 20, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawGrid(w, h) {
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.025)';
    ctx.lineWidth = 1;
    const gap = 50;
    ctx.beginPath();
    for (let x = gap; x < w; x += gap) { ctx.moveTo(x, 0); ctx.lineTo(x, h); }
    for (let y = gap; y < h; y += gap) { ctx.moveTo(0, y); ctx.lineTo(w, y); }
    ctx.stroke();
  }

  function drawTrail() {
    for (let i = 0; i < trail.length; i++) {
      const t = i / trail.length;
      const pt = trail[i];
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, 2 + t * 5, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(90, 215, 255, ' + (t * 0.35).toFixed(3) + ')';
      ctx.fill();
    }
  }

  function drawAngleArc(p) {
    ctx.strokeStyle = 'rgba(90, 215, 255, 0.4)';
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 4]);
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
    ctx.lineTo(p.x, p.y + L * 0.9);
    ctx.stroke();
    ctx.setLineDash([]);
    const r = 40;
    const a = Math.PI / 2 - theta;
    ctx.beginPath();
    ctx.arc(p.x, p.y, r, Math.min(a, Math.PI / 2), Math.max(a, Math.PI / 2));
    ctx.stroke();
    ctx.fillStyle = 'rgba(90, 215, 255, 0.8)';
    ctx.font = '11px "Consolas", monospace';
    ctx.fillText((theta * 180 / Math.PI).toFixed(1) + '°', p.x + 14, p.y + 34);
  }

  function updateHud() {
    document.getElementById('hudTheta').textContent = (theta * 180 / Math.PI).toFixed(1) + '°';
    document.getElementById('hudOmega').textContent = omega.toFixed(2) + ' rad/s';
    const T = 2 * Math.PI * Math.sqrt(L / g);
    document.getElementById('hudPeriod').textContent = T.toFixed(2) + ' s';
    document.getElementById('hudState').textContent = running ? '运行中' : '已暂停';
  }

  elL.addEventListener('input', () => { L = +elL.value; valL.textContent = L + ' px'; });
  elG.addEventListener('input', () => { g = +elG.value; valG.textContent = g; });
  elA.addEventListener('input', () => { angle0 = +elA.value; valA.textContent = angle0 + '°'; });

  btnPause.addEventListener('click', () => {
    running = !running;
    btnPause.textContent = running ? '暂停' : '继续';
  });
  btnReset.addEventListener('click', reset);

  // 拖拽推动摆球
  let dragging = false;
  canvas.addEventListener('pointerdown', (e) => {
    dragging = true;
    running = false;
    btnPause.textContent = '继续';
    pushTo(e.clientX, e.clientY);
  });
  canvas.addEventListener('pointermove', (e) => {
    if (dragging) pushTo(e.clientX, e.clientY);
  });
  canvas.addEventListener('pointerup', () => { dragging = false; });
  canvas.addEventListener('dblclick', () => { reset(); });

  function pushTo(x, y) {
    const p = pivot();
    theta = Math.atan2(x - p.x, y - p.y);
    omega = 0;
    trail = [];
  }

  updateHud();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
